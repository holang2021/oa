<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HOLANG OA · 全量 CRM 蓝图原型（含建设状态）</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#fff; --ink:#1e293b; --sub:#64748b; --line:#e2e8f0;
    --pri:#2563eb; --pri-d:#1d4ed8; --pri-bg:#eff6ff;
    --green:#16a34a; --green-bg:#dcfce7; --amber:#d97706; --amber-bg:#fef3c7;
    --gray:#64748b; --gray-bg:#f1f5f9; --red:#dc2626; --red-bg:#fee2e2;
    --dom:#2563eb; --exp:#7c3aed;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif}
  body{background:var(--bg);color:var(--ink);font-size:13px;height:100vh;overflow:hidden}
  /* top bar */
  .top{height:52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:16px}
  .logo{font-weight:800;font-size:16px;letter-spacing:.5px;color:var(--pri)}
  .logo small{color:var(--sub);font-weight:500;font-size:11px;margin-left:6px}
  .sw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .sw button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-size:12px;color:var(--sub)}
  .sw button.on{color:#fff}
  .sw button.dom.on{background:var(--dom)}
  .sw button.exp.on{background:var(--exp)}
  .search{flex:1;max-width:360px;position:relative}
  .search input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--line);border-radius:8px;font-size:12px}
  .search:before{content:"🔍";position:absolute;left:9px;top:7px;font-size:12px}
  .me{margin-left:auto;display:flex;align-items:center;gap:8px}
  .me .av{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--sub)}
  .legend .b{padding:2px 8px;border-radius:20px;font-weight:600}
  .b.done{background:var(--green-bg);color:var(--green)}
  .b.plan{background:var(--amber-bg);color:var(--amber)}
  /* layout */
  .wrap{display:flex;height:calc(100vh - 52px)}
  .side{width:208px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0}
  .nav-g{font-size:10px;color:var(--sub);padding:10px 16px 4px;text-transform:uppercase;letter-spacing:.5px}
  .nav{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .nav:hover{background:var(--bg)}
  .nav.on{background:var(--pri-bg);border-left-color:var(--pri);color:var(--pri-d);font-weight:600}
  .nav .ic{width:18px;text-align:center}
  .nav .dot{margin-left:auto;width:7px;height:7px;border-radius:50%}
  .dot.d{background:var(--green)} .dot.p{background:var(--amber)}
  .main{flex:1;overflow-y:auto;padding:18px 22px}
  .crumb{color:var(--sub);font-size:12px;margin-bottom:10px}
  .crumb b{color:var(--ink)}
  h2{font-size:18px;margin-bottom:4px}
  .desc{color:var(--sub);font-size:12px;margin-bottom:16px;max-width:820px;line-height:1.6}
  /* cards */
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .stat{font-size:26px;font-weight:800}
  .stat.s{font-size:20px}
  .muted{color:var(--sub);font-size:11px;margin-top:4px}
  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:9px 14px;cursor:pointer;font-size:12px;color:var(--sub);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
  .tab.on{color:var(--pri-d);border-bottom-color:var(--pri);font-weight:600}
  .tab .dot{width:6px;height:6px;border-radius:50%}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--sub);font-weight:600;background:var(--bg)}
  tr:hover td{background:#fafcff}
  .btn{border:1px solid var(--pri);color:var(--pri-d);background:#fff;border-radius:7px;padding:5px 12px;cursor:pointer;font-size:12px}
  .btn.fill{background:var(--pri);color:#fff}
  .btn.ghost{border-color:var(--line);color:var(--sub)}
  .btn.sm{padding:3px 9px;font-size:11px}
  .pill{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
  .pill.A{background:#fee2e2;color:#dc2626} .pill.B{background:#fef3c7;color:#d97706} .pill.C{background:#e0e7ff;color:#4338ca}
  .pill.ok{background:var(--green-bg);color:var(--green)} .pill.wait{background:var(--amber-bg);color:var(--amber)}
  .pill.pool{background:#ede9fe;color:#7c3aed}
  /* stepper */
  .steps{display:flex;align-items:center;gap:0;margin:8px 0 4px}
  .stp{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative}
  .stp .cir{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;z-index:2}
  .stp .cir.done{background:var(--green)} .stp .cir.do{background:var(--pri)} .stp .cir.todo{background:#cbd5e1;color:#fff}
  .stp .lb{font-size:11px;color:var(--sub);text-align:center}
  .stp:not(:last-child):after{content:"";position:absolute;top:15px;left:60%;width:80%;height:3px;background:var(--line);z-index:1}
  .stp.done:not(:last-child):after{background:var(--green)}
  /* planned block */
  .planbox{background:var(--amber-bg);border:1px dashed var(--amber);border-radius:12px;padding:16px;color:#92400e}
  .planbox h3{color:#b45309;margin-bottom:10px}
  .kf{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .kf span{background:#fff;border:1px solid #fcd34d;border-radius:6px;padding:4px 10px;font-size:11px;color:#92400e}
  .fieldrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
  .fieldrow .k{width:130px;color:var(--sub);flex-shrink:0}
  .fieldrow .v{flex:1}
  .hidden{display:none}
  .tag-impl{background:var(--green-bg);color:var(--green);border-radius:6px;font-size:10px;padding:1px 6px;font-weight:700}
  .tag-plan{background:var(--amber-bg);color:var(--amber);border-radius:6px;font-size:10px;padding:1px 6px;font-weight:700}
</style>
</head>
<body>
<div class="top">
  <div class="logo">HOLANG<small>All In One · OA</small></div>
  <div class="sw">
    <button class="dom on" id="sw-dom" onclick="setType('domestic')">内销</button>
    <button class="exp" id="sw-exp" onclick="setType('export')">外销</button>
  </div>
  <div class="search"><input placeholder="搜索客户 / 商机 / 订单 / 线索…（规划：走后端 search 参数）" /></div>
  <div class="legend">
    <span class="b done">● 已实现</span>
    <span class="b plan">● 规划中</span>
  </div>
  <div class="me"><div class="av">刘</div><span>刘总（管理员）</span></div>
</div>

<div class="wrap">
  <div class="side" id="side"></div>
  <div class="main" id="main"></div>
</div>

<script>
// ---------- 导航定义（对应蓝图 9 模块 + 4 迭代）----------
const NAV = [
  {g:"核心工作台"},
  {id:"workbench", ic:"🏠", label:"工作台", sub:"统一待办中心", st:"plan", batch:"批次0–1"},
  {g:"销售主链路"},
  {id:"customer", ic:"👥", label:"客户", sub:"M4·聚合根H-4", st:"done", batch:"批次0–1"},
  {id:"opportunity", ic:"💡", label:"商机", sub:"M5·公海", st:"done", batch:"批次1"},
  {id:"leadpool", ic:"🎯", label:"线索公海", sub:"M3·市场", st:"plan", batch:"批次2"},
  {g:"资源与运营"},
  {id:"product", ic:"📦", label:"产品", sub:"M2·成本毛利", st:"plan", batch:"批次1–2"},
  {id:"market", ic:"📣", label:"市场", sub:"M3·活动/OCR", st:"plan", batch:"批次2"},
  {id:"service", ic:"🔧", label:"售后", sub:"M6·回访工单", st:"plan", batch:"批次1–2"},
  {id:"finance", ic:"💰", label:"财务", sub:"M7·回款对账", st:"plan", batch:"批次2"},
  {id:"analytics", ic:"📊", label:"分析", sub:"M8·区域维度", st:"plan", batch:"批次2"},
  {id:"production", ic:"🏭", label:"生产", sub:"M9·BOM工单", st:"plan", batch:"批次3"},
  {g:"迭代能力"},
  {id:"comm", ic:"💬", label:"一体化沟通", sub:"迭代#1·留痕", st:"plan", batch:"批次1–2"},
  {id:"migrate", ic:"🔄", label:"导入导出", sub:"迭代#2·伙伴云", st:"plan", batch:"批次0–2"},
  {id:"ai", ic:"🤖", label:"AI 数字员工", sub:"迭代#3·H-3", st:"plan", batch:"阶段0"},
];

let state = { type:"domestic", view:"workbench", tab:"overview" };
const isExp = ()=> state.type==="export";
const STL = (t)=> isExp()?"外销":"内销";

// ---------- 渲染侧栏 ----------
function renderSide(){
  const el = document.getElementById("side");
  el.innerHTML = NAV.map(n=>{
    if(n.g) return `<div class="nav-g">${n.g}</div>`;
    const on = state.view===n.id ? "on":"";
    const dot = n.st==="done"?'<span class="dot d"></span>':'<span class="dot p"></span>';
    return `<div class="nav ${on}" onclick="go('${n.id}')"><span class="ic">${n.ic}</span><span>${n.label}</span>${dot}</div>`;
  }).join("");
}

// ---------- 顶部内外销开关 ----------
function setType(t){
  state.type=t;
  document.getElementById("sw-dom").className = "dom"+(t==="domestic"?" on":"");
  document.getElementById("sw-exp").className = "exp"+(t==="export"?" on":"");
  renderMain();
}
function go(v){ state.view=v; state.tab="overview"; renderSide(); renderMain(); }

// ---------- 主区路由 ----------
function renderMain(){
  const m = document.getElementById("main");
  const map = {workbench:V_workbench, customer:V_customer, opportunity:V_opportunity, leadpool:V_leadpool,
    product:V_product, market:V_market, service:V_service, finance:V_finance, analytics:V_analytics,
    production:V_production, comm:V_comm, migrate:V_migrate, ai:V_ai};
  (map[state.view]||V_workbench)(m);
}

// ============ 各视图 ============
function V_workbench(m){
  m.innerHTML = `
  <div class="crumb">工作台 / <b>统一待办中心</b> <span class="tag-plan">规划中 · 批次0–1</span></div>
  <h2>统一待办中心 <span style="font-size:12px;color:var(--sub)">（P3 拍板：首页=统一待办聚合）</span></h2>
  <p class="desc">聚合所有待我处理的事项，模块侧边导航保留不砍（共识#1/#5）。规划接口 <code>GET /api/todo/aggregate</code>（按 userId+RBAC）。下方为蓝图规划的 6 类聚合项。</p>
  <div class="grid g3">
    ${todoCard("审批待办","12","合同/PI 审批 + 客户等级复审","批次1")}
    ${todoCard("公海认领","8","客户/商机 待认领（含线索，批次2）","批次0–1")}
    ${todoCard("回访提醒","5","售后回访到期（M6）","批次1–2")}
    ${todoCard("回款催办","3","逾期/临近回款","批次2")}
    ${todoCard("离职移交","1","H-4 客户整体移交","批次0")}
    ${todoCard("客户降级","2","A/B/C 复审降级提醒（P2）","批次1")}
  </div>
  <div class="card" style="margin-top:14px">
    <h3>📈 我的效率视图（共识#5 · 规划）</h3>
    <div class="grid g4">
      <div><div class="stat s">39</div><div class="muted">我的客户（A/B/C）</div></div>
      <div><div class="stat s">17</div><div class="muted">进行中商机</div></div>
      <div><div class="stat s">¥2.4M</div><div class="muted">本月预计回款</div></div>
      <div><div class="stat s" style="color:var(--green)">68%</div><div class="muted">获客漏斗转化</div></div>
    </div>
  </div>`;
}
function todoCard(t,n,sub,batch){
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start">
    <h3>${t}</h3><span class="pill wait">${batch}</span></div>
    <div class="stat">${n}</div><div class="muted">${sub}</div></div>`;
}

function V_customer(m){
  const poolMode = state.tab==="pool";
  m.innerHTML = `
  <div class="crumb">销售主链路 / <b>客户</b> <span class="tag-impl">D1 公海+认领退回 已实现</span></div>
  <h2>客户管理 <span style="font-size:12px;color:var(--sub)">M4 · 聚合根H-4 · 查重 · 等级A/B/C</span></h2>
  <div class="tabs">
    <div class="tab ${!poolMode?'on':''}" onclick="setTab('mine')">我的客户</div>
    <div class="tab ${poolMode?'on':''}" onclick="setTab('pool')">公海 <span class="pill pool">${poolMode?'':'23'}</span></div>
  </div>
  ${poolMode? custPoolTable() : custMineTable()}
  <div style="margin-top:18px">${custDetailStub(m)}</div>`;
}
function setTab(t){ state.tab = t==="pool"?"pool":"mine"; renderMain(); }
function custMineTable(){
  const rows = [
    ["苏州某气体有限公司","A","已认领·我","制氮机 N-200","2026-07-20",`<span class="pill ok">健康</span>`],
    ["PT Gasindo Pratama", isExp()?"A":"B","已认领·我","PSA 制氧 O-50","2026-07-18",`<span class="pill ok">健康</span>`],
    ["Vietnam Industrial Gas", isExp()?"B":"C","已认领·我","制氢 H-10","2026-07-15",`<span class="pill wait">超期跟进</span>`],
    ["杭州某环保科技","C","已认领·我","模块化制氮","2026-07-10",`<span class="pill ok">健康</span>`],
  ];
  return `<div class="card"><table><thead><tr><th>客户名称</th><th>等级</th><th>归属</th><th>主推产品</th><th>最近跟进</th><th>健康</th><th>操作</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r[0]}</td><td><span class="pill ${r[1]}">${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td>
      <td><button class="btn sm" onclick="alert('进入客户360详情（见下方）')">查看</button> <button class="btn sm ghost" onclick="alert('退回公海：聚合根H-4整体移动，含商机/报价/订单')">退回公海</button></td></tr>`).join("")}
  </tbody></table>
  <div class="muted" style="margin-top:8px">共 39 个我的客户 · 内销/外销按 salesType 服务端强制隔离（蓝图第八节）</div></div>`;
}
function custPoolTable(){
  const rows = [
    ["未知询盘客户（询盘云回流）", isExp()?"—":"B","无主·公海","PI 询盘","2026-07-21",`<button class="btn sm fill" onclick="alert('认领：聚合根整体归属我，商机/报价/订单随迁')">认领</button>`],
    ["Gujarat Oxygen Ltd", isExp()?"B":"—","无主·公海","PSA 制氧","2026-07-19",`<button class="btn sm fill" onclick="alert('认领')">认领</button>`],
    ["某未开发制造厂","C","无主·公海","制氮机","2026-07-12",`<button class="btn sm fill" onclick="alert('认领')">认领</button>`],
  ];
  return `<div class="card"><div style="margin-bottom:8px;color:var(--sub);font-size:12px">公海客户无主，认领后整体归属（H-4）。总监审批阈值由 approval-engine 控制（P2）。</div><table><thead><tr><th>客户名称</th><th>等级</th><th>状态</th><th>来源</th><th>入池</th><th>操作</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r[0]}</td><td><span class="pill ${r[1]}">${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join("")}
  </tbody></table></div>`;
}

// 客户360 详情（全量 tab，蓝图 M4 + 关联模块）
function custDetailStub(m){
  const tabs = [
    ["overview","概览 · 5步闭环",true],["contacts","联系人",false],["opp","商机",false],
    ["quote","报价",true],["contract","合同/PI",true],["order","订单",false],
    ["pay","回款",false],["comm","沟通记录",false],["service","售后回访",false],
    ["billing","开票",false],["audit","异动",false],["timeline","时间轴",false],
  ];
  // 已实现标记：overview(D3闭环) quote(D3真实数据) contract(D3接/pi) ；其余规划中
  const doneTabs = {overview:1, quote:1, contract:1};
  m._custTabs = tabs;
  const tb = tabs.map(t=>`<div class="tab ${state.detailTab===t[0]||(!state.detailTab&&t[0]==="overview")?'on':''}" onclick="setDetail('${t[0]}')">${t[1]} ${doneTabs[t[0]]?'<span class="tag-impl">已实现</span>':'<span class="tag-plan">规划</span>'}</div>`).join("");
  return `<div class="card"><h3>👤 客户 360 详情 — 苏州某气体有限公司 <span class="pill A">A</span> <span class="pill ok">健康</span></h3>
    <div class="tabs">${tb}</div>
    <div id="detailBody">${detailBody()}</div></div>`;
}
function setDetail(t){ state.detailTab=t; renderMain(); }
function detailBody(){
  const t = state.detailTab||"overview";
  if(t==="overview"){
    const stage = isExp()
      ? [["商机",1],["报价",1],["PI",1],["订单",1],["回款",0]]
      : [["商机",1],["报价",1],["合同",1],["订单",1],["回款",0]];
    const circ = stage.map(s=>`<div class="stp ${s[1]?'done':''}"><div class="cir ${s[1]?'done':'todo'}">${s[1]?'✓':''}</div><div class="lb">${s[0]}</div></div>`).join("");
    return `<p class="desc">销售闭环 5 步（D3 已实现）：客户→商机→报价/合同(PI)→订单→回款。内销走合同、外销走 PI；用 orders.contractId / piId 兜底判定达成。</p>
      <div class="steps">${circ}</div>
      <div class="grid g3" style="margin-top:14px">
        <div class="card"><h3>客户等级 A/B/C <span class="tag-impl">已实现·P2</span></h3><div class="fieldrow"><span class="k">当前等级</span><span class="v"><span class="pill A">A</span> 短期可成（每5–7天跟进）</span></div><div class="fieldrow"><span class="k">下次跟进</span><span class="v">2026-07-25（自动生成）</span></div><div class="fieldrow"><span class="k">复审降级</span><span class="v">A占比控20–30%</span></div></div>
        <div class="card"><h3>查重 · 权威键 <span class="tag-plan">规划·第九节</span></h3><div class="fieldrow"><span class="k">内销键</span><span class="v">统一社会信用代码</span></div><div class="fieldrow"><span class="k">外销键</span><span class="v">邓白氏码 DUNS</span></div><div class="fieldrow"><span class="k">DeepSeek</span><span class="v">仅辅助补全/背调</span></div></div>
        <div class="card"><h3>AI 健康预警 <span class="tag-plan">迭代#3·阶段0</span></h3><div class="fieldrow"><span class="k">状态</span><span class="v"><span class="pill ok">健康</span></span></div><div class="fieldrow"><span class="k">预警</span><span class="v">无逾期/无超期跟进</span></div><div class="fieldrow"><span class="k">边界</span><span class="v">阶段0仅读取展示</span></div></div>
      </div>
      <div class="fieldrow" style="margin-top:12px"><span class="k">聚合根 H-4</span><span class="v">联系人/商机/报价/合同/订单/回款/开票/售后随客户整体移动（移交·退公海·分配），不单独分离</span></div>`;
  }
  if(t==="quote"){
    return `<p class="desc">报价 tab（D3 已实现）：读取真实 <code>GET /quotes</code>，不再是「暂无报价」桩。</p>

  }

  const planFields = {
    contacts:[["联系人","姓名/职务/电话/邮箱/微信"],["归属","客户聚合根 H-4"]],

    order:[["订单","产品/数量/金额/交期"],["关联","contractId(内)/piId(外)"]],
    pay:[["回款","计划/实收/对账"],["权限","导出仅管理员/财务（H-2）"]],
    comm:[["沟通","企微+邮件+WhatsApp+微信系统级留痕（P1）"],["AI","对话摘要后置 H-3 阶段1"]],
    service:[["回访","service-requests/visit（M6）"],["工单","现场媒资/满意度/审批"],["知识","service_knowledge 沉淀"]],
    billing:[["开票","customer_billing 信息"],["申请","数电票 invoice_apply（B/C）"]],
    audit:[["异动","audit_log 全模块挂"],["范围","公海/认领/变更/导出全留痕"]],
    timeline:[["时间轴","客户全生命周期事件流"]],
  };
  const f = planFields[t]||[["规划中","—"]];
  return `<div class="planbox"><h3>📋 ${labelOf(t)} — 规划中（蓝图对应模块）</h3>
    <p>${descOf(t)}</p>
    <div class="kf">${f.map(x=>`<span>${x[0]}：${x[1]}</span>`).join("")}</div></div>`;
}

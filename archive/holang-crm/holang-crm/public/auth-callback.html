<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企微授权回调</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: linear-gradient(135deg, #f0f4ff 0%, #fff 50%, #e8f0fe 100%); }
    .card { background: white; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.06); max-width: 360px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 16px; color: #1f2937; margin: 0 0 8px; }
    p { font-size: 13px; color: #9ca3af; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>正在验证身份...</h2>
    <p>请稍候</p>
  </div>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search)
      const code = params.get('code')
      const state = params.get('state')
      const savedState = localStorage.getItem('wecom_oauth_state')

      if (!code || !state || state !== savedState) {
        localStorage.setItem('holang_user', JSON.stringify({
          userId: 'dev_oauth',
          name: '管理员',
          avatar: '',
          department: '管理部',
        }))
        window.location.href = '/?auth=dev'
        return
      }

      // Development: simulate successful auth
      // Production: POST code to backend proxy → exchange for user info
      localStorage.setItem('holang_user', JSON.stringify({
        userId: 'wecom_' + Date.now(),
        name: '管理员',
        avatar: '',
        department: '管理部',
      }))
      localStorage.removeItem('wecom_oauth_state')
      window.location.href = '/?auth=wecom'
    })()
  </script>
</body>
</html>

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: holang-crm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # 所有敏感/环境相关配置均通过同目录 .env 注入（.env 已被 .gitignore 忽略）。
      # 见 .env.example（需手动补全；本文件不写真实密钥）。
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: ${DATABASE_URL}
      EMAIL_CRED_ENCRYPTION_KEY: ${EMAIL_CRED_ENCRYPTION_KEY}
    ports:
      - "3000:3000"
    volumes:
      # SQLite 数据库文件落在 /data，由命名卷持久化（与 schema.prisma provider=sqlite 对齐）
      - backend_data:/data
    networks:
      - holang-network
    command: sh -c "npx prisma db push && npm run seed && npm run start:prod"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: nginx:alpine
    container_name: holang-crm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # 真实构建产物位于 packages/oa/dist；nginx 配置见 packages/oa/nginx.conf
      - ./packages/oa/dist:/usr/share/nginx/html:ro
      - ./packages/oa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - holang-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_data:

networks:
  holang-network:
    driver: bridge

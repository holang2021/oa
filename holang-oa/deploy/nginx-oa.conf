# ============================================================
# HOLANG OA — Nginx 生产部署配置
# 部署目标: oa.holangchina.com
# 前端: 静态文件 (Vite build → dist/)
# 后端: Node.js (localhost:3001)
# 企微 OAuth 回调: /auth-callback.html
# ============================================================

server {
    listen 80;
    server_name oa.holangchina.com;
    
    # 强制 HTTPS（企微 OAuth 必须 HTTPS）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name oa.holangchina.com;

    # SSL 证书（Let's Encrypt 免费）
    ssl_certificate     /etc/nginx/ssl/oa.holangchina.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/oa.holangchina.com/privkey.pem;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 前端静态文件
    root /var/www/oa/dist;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ==================== API 反向代理 ====================
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ==================== OAuth 回调页（必须在根路径） ====================
    location /auth-callback.html {
        try_files $uri =404;
    }

    # ==================== SPA fallback ====================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================== 安全：禁止访问隐藏文件 ====================
    location ~ /\. {
        deny all;
    }
}

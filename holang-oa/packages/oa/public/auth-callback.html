<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOLANG OA — 企微授权登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: linear-gradient(135deg, #eff6ff 0%, #ffffff 50%, #f0fdf4 100%);
    }
    .card {
      background: white; border-radius: 20px; padding: 48px 40px; text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06); max-width: 380px; width: 90%;
      border: 1px solid #f1f5f9;
    }
    .logo {
      width: 56px; height: 56px; background: #2563eb; border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: white; margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.25);
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #e5e7eb;
      border-top-color: #2563eb; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 18px; color: #1e293b; margin: 0 0 8px; font-weight: 600; }
    .status { font-size: 14px; color: #94a3b8; margin: 0; }
    .error { color: #ef4444; font-size: 14px; margin-top: 16px; padding: 12px;
      background: #fef2f2; border-radius: 10px; display: none; }
    .error.show { display: block; }
    .retry-btn { margin-top: 16px; padding: 8px 24px; background: #2563eb; color: white;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer; display: none; }
    .retry-btn.show { display: inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">H</div>
    <div class="spinner" id="spinner"></div>
    <h2 id="title">正在验证身份...</h2>
    <p class="status" id="status">请稍候</p>
    <div class="error" id="error"></div>
    <button class="retry-btn" id="retry" onclick="location.reload()">重新登录</button>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search)
      const code = params.get('code')
      const state = params.get('state')
      const savedState = localStorage.getItem('wecom_oauth_state')

      function showError(msg) {
        document.getElementById('spinner').style.display = 'none'
        document.getElementById('title').textContent = '登录失败'
        document.getElementById('status').textContent = ''
        document.getElementById('error').textContent = msg
        document.getElementById('error').classList.add('show')
        document.getElementById('retry').classList.add('show')
      }

      function showStatus(text) {
        document.getElementById('status').textContent = text
      }

      // 校验参数
      if (!code) {
        showError('缺少授权码，请从企业微信工作台重新打开应用')
        return
      }

      // CSRF 防护：校验 state
      if (!state || state !== savedState) {
        showError('安全校验失败（state 不匹配），请重新登录')
        return
      }

      // Step 1: 用 code 向后端换取 JWT
      showStatus('正在获取身份信息...')

      try {
        // 判断当前环境：生产环境用相对路径（同域），开发环境用 localhost
        const apiBase = window.location.hostname === 'localhost'
          ? 'http://localhost:3001/api/v1'
          : '/api/v1'

        const res = await fetch(apiBase + '/auth/wecom/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        })

        const data = await res.json()

        if (data.code !== 0 || !data.data?.token) {
          showError(data.message || '身份验证失败，请重试')
          return
        }

        showStatus('登录成功，正在跳转...')

        // Step 2: 存储 token + 用户信息
        localStorage.setItem('oa_token', data.data.token)
        localStorage.setItem('oa_user', JSON.stringify(data.data.user))
        localStorage.removeItem('wecom_oauth_state')

        // Step 3: 跳转到主页
        document.getElementById('title').textContent = '登录成功'
        document.getElementById('spinner').style.display = 'none'

        setTimeout(() => {
          window.location.href = '/'
        }, 600)

      } catch (err) {
        showError('网络错误：无法连接到服务器，请检查网络后重试')
        console.error('[OAuth Callback]', err)
      }
    })()
  </script>
</body>
</html>

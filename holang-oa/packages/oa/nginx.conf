# ============================================================
# HOLANG OA 前端 Nginx 配置（docker 部署用）
# 与 docker-compose.yml frontend 服务挂载路径一致：
#   ./packages/oa/nginx.conf -> /etc/nginx/conf.d/default.conf
#   ./packages/oa/dist       -> /usr/share/nginx/html
# 后端服务名 backend，监听 3000，路由前缀 /api/v1。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 客户端请求体大小上限（与后端 express.json limit 对齐，避免大附件类接口 413）
    client_max_body_size 10m;

    # SPA 历史路由回退：非文件请求统一交给 index.html 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器（backend 服务名 + 3000 端口）
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / 长连接备用（当前未启用，保留无害）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

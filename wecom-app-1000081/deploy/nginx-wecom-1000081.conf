# ============================================================
# nginx 反向代理 + HTTPS 终止（应用 1000081 回调）
# 部署位置: /etc/nginx/conf.d/wecom-1000081.conf
# 前置: 域名解析 A 记录指向本机 + SSL 证书（Cloudflare 或 Let's Encrypt）
# 企微回调 URL 必须是 https，且域名需加入 1000081 应用"可信域名"
# ============================================================

server {
    listen 443 ssl http2;
    server_name wecom10081.holangchina.com;   # TODO: 替换为实际回调域名

    ssl_certificate     /etc/nginx/ssl/wecom10081.holangchina.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wecom10081.holangchina.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 企微回调：透传原始请求到 Node 服务（127.0.0.1:3008）
    location /wecom/1000081/callback {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 企微要求 5 秒内响应，超时由企微重试
        proxy_read_timeout    5s;
        proxy_connect_timeout 5s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3008;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name wecom10081.holangchina.com;
    return 301 https://$host$request_uri;
}

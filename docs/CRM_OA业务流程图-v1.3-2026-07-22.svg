<svg viewBox="0 0 680 890" width="100%" role="img">
  <title>HOLANG CRM on OA 业务流程总览 v1.3（All In One 理念审视后）</title>
  <desc>在 v1.2 基础上，按多方会议共识升级：①顶部统一待办中心(系统首页唯一入口) ②AI 工作流助手节点级嵌入(写PI自动填充/条款推荐/客户健康预警) ③一体化通道提前批次1/2轻量留痕接入主流程 ④个人效率视图 ⑤跨模块穿透(保留上下文) ⑥售后自动带出客户/合同/机器 ⑦多端补单点登录·三端一致·可看不可下。内销/外销按 salesType 服务端强制隔离；公海与数据禁止下载(H-2)；H-3 自动化红线(初审/草稿归AI,终审/签署/回款必须人)。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="30" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">HOLANG CRM on OA — 业务流程总览（v1.3 · All In One 理念审视后 · 待刘总确认）</text>

  <!-- 统一待办中心（首页唯一入口） -->
  <g>
    <rect x="40" y="46" width="440" height="40" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="260" y="70" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C" text-anchor="middle" dominant-baseline="central">统一待办中心（系统首页唯一入口 · 聚合审批/公海/回访/回款催办）</text>
  </g>

  <rect x="40" y="95" width="440" height="610" rx="16" fill="#FBFAF7" stroke="#C9C7C0" stroke-width="0.5"/>
  <rect x="500" y="95" width="140" height="610" rx="16" fill="#FBFAF7" stroke="#C9C7C0" stroke-width="0.5"/>
  <text x="570" y="118" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">支撑域（贯穿）</text>

  <!-- 1 市场活动 -->
  <g>
    <rect x="60" y="120" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="135" y="147" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">市场活动</text>
  </g>
  <!-- 2 线索公海 -->
  <g>
    <rect x="240" y="115" width="200" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="135" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">线索公海</text>
    <text x="340" y="153" font-family="sans-serif" font-size="11" fill="#B3261E" text-anchor="middle" dominant-baseline="central">内销/外销分离 · 禁止下载</text>
    <text x="340" y="169" font-family="sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">分配·回流·总监审批（条件触发）</text>
  </g>
  <!-- 3 统一客户池 -->
  <g>
    <rect x="110" y="195" width="300" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="260" y="215" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">统一客户池（SoR）</text>
    <text x="260" y="233" font-family="sans-serif" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">查重(国内信用代码 / 海外邓白氏码)</text>
    <text x="260" y="249" font-family="sans-serif" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">公司变更·开票·异动(audit_log)</text>
  </g>
  <!-- 4 客户·商机公海 -->
  <g>
    <rect x="110" y="271" width="300" height="44" rx="8" fill="#EAF6EF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="260" y="289" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">客户·商机公海（未认领/退回→可认领）</text>
    <text x="260" y="307" font-family="sans-serif" font-size="11" fill="#B3261E" text-anchor="middle" dominant-baseline="central">内销/外销分离 · 禁止下载</text>
  </g>

  <!-- 5 双运营 -->
  <rect x="55" y="325" width="410" height="158" rx="12" fill="#FBFAF7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="260" y="343" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">双运营系统（外销 / 内销 · 统一池 + 双流）</text>
  <g><rect x="70" y="353" width="160" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="150" y="369" font-family="sans-serif" font-size="13" fill="#26215C" text-anchor="middle" dominant-baseline="central">外销·商机</text></g>
  <g><rect x="70" y="391" width="160" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="150" y="407" font-family="sans-serif" font-size="13" fill="#26215C" text-anchor="middle" dominant-baseline="central">外销·报价</text></g>
  <g><rect x="70" y="428" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="150" y="445" font-family="sans-serif" font-size="13" fill="#26215C" text-anchor="middle" dominant-baseline="central">PI · PL · 销售合同</text><text x="150" y="461" font-family="sans-serif" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">统一模板·强校验防错</text></g>
  <g><rect x="260" y="353" width="160" height="32" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/><text x="340" y="369" font-family="sans-serif" font-size="13" fill="#4B1528" text-anchor="middle" dominant-baseline="central">内销·商机</text></g>
  <g><rect x="260" y="391" width="160" height="32" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/><text x="340" y="407" font-family="sans-serif" font-size="13" fill="#4B1528" text-anchor="middle" dominant-baseline="central">内销·报价</text></g>
  <g><rect x="260" y="428" width="160" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/><text x="340" y="445" font-family="sans-serif" font-size="13" fill="#4B1528" text-anchor="middle" dominant-baseline="central">商务合同</text><text x="340" y="461" font-family="sans-serif" font-size="11" fill="#993556" text-anchor="middle" dominant-baseline="central">结构化·关键条款防错</text></g>
  <text x="260" y="478" font-family="sans-serif" font-size="10" fill="#2738C9" text-anchor="middle" dominant-baseline="central">AI 内嵌助手：写PI自动填充 · 条款推荐 · 客户健康预警</text>

  <!-- 6 订单/发货 -->
  <g><rect x="130" y="493" width="150" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="205" y="513" font-family="sans-serif" font-size="13" fill="#26215C" text-anchor="middle" dominant-baseline="central">订单</text></g>
  <g><rect x="300" y="493" width="140" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="370" y="513" font-family="sans-serif" font-size="13" fill="#26215C" text-anchor="middle" dominant-baseline="central">发货</text></g>
  <!-- 7 回款/财务 -->
  <g><rect x="120" y="548" width="120" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="180" y="568" font-family="sans-serif" font-size="13" fill="#412402" text-anchor="middle" dominant-baseline="central">回款</text></g>
  <g><rect x="260" y="548" width="200" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="360" y="568" font-family="sans-serif" font-size="13" fill="#412402" text-anchor="middle" dominant-baseline="central">财务（回款计划·对账·付款单·资金账户）</text></g>
  <!-- 8 售后 -->
  <g>
    <rect x="55" y="603" width="410" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="260" y="621" font-family="sans-serif" font-size="13" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">售后服务（利他 · 轻量）</text>
    <text x="260" y="639" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">服务请求→工单→进度→回访→知识沉淀 ｜ 自动带出客户/合同/机器</text>
    <text x="260" y="654" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">（二期：售后报价/合同/质保）</text>
  </g>

  <!-- 支撑域 -->
  <g><rect x="510" y="130" width="120" height="50" rx="8" fill="#FBFAF7" stroke="#5F5E5A" stroke-width="0.5"/><text x="570" y="150" font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">RBAC 角色</text><text x="570" y="168" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">企微 1000081</text></g>
  <g><rect x="510" y="195" width="120" height="56" rx="8" fill="#FBFAF7" stroke="#5F5E5A" stroke-width="0.5"/><text x="570" y="215" font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">多端运行</text><text x="570" y="233" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">单点登录·三端一致</text><text x="570" y="245" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">网页·小程序·APP·可看不可下</text></g>
  <g><rect x="510" y="266" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="570" y="286" font-family="sans-serif" font-size="12" font-weight="600" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">一体化通道</text><text x="570" y="304" font-family="sans-serif" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">批次1/2 轻量留痕</text><text x="570" y="316" font-family="sans-serif" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">企微·微信·邮件·WhatsApp</text></g>
  <g><rect x="510" y="337" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="570" y="357" font-family="sans-serif" font-size="12" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">伙伴云迁移</text><text x="570" y="375" font-family="sans-serif" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">API导入更新·规则预制</text></g>
  <g><rect x="510" y="408" width="120" height="56" rx="8" fill="#E7ECFB" stroke="#2738C9" stroke-width="0.5"/><text x="570" y="428" font-family="sans-serif" font-size="12" font-weight="500" fill="#101B6B" text-anchor="middle" dominant-baseline="central">DeepSeek 智能层</text><text x="570" y="446" font-family="sans-serif" font-size="10" fill="#2738C9" text-anchor="middle" dominant-baseline="central">查重·公司补全·背调</text></g>
  <g><rect x="510" y="479" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="570" y="499" font-family="sans-serif" font-size="11" font-weight="600" fill="#042C53" text-anchor="middle" dominant-baseline="central">AI 工作流助手</text><text x="570" y="517" font-family="sans-serif" font-size="10" fill="#185FA5" text-anchor="middle" dominant-baseline="central">预填·提醒·初审</text></g>
  <g><rect x="510" y="544" width="120" height="50" rx="8" fill="#FBE7E5" stroke="#B3261E" stroke-width="0.5"/><text x="570" y="564" font-family="sans-serif" font-size="11" font-weight="500" fill="#7A1410" text-anchor="middle" dominant-baseline="central">数据防泄漏 H-2</text><text x="570" y="582" font-family="sans-serif" font-size="10" fill="#B3261E" text-anchor="middle" dominant-baseline="central">公海·禁止下载</text></g>
  <g><rect x="510" y="609" width="120" height="50" rx="8" fill="#FBE7E5" stroke="#B3261E" stroke-width="0.5"/><text x="570" y="629" font-family="sans-serif" font-size="10" font-weight="500" fill="#7A1410" text-anchor="middle" dominant-baseline="central">H-3 自动化红线</text><text x="570" y="646" font-family="sans-serif" font-size="9" fill="#B3261E" text-anchor="middle" dominant-baseline="central">初审/草稿=AI 终审/签署=人</text></g>

  <!-- 底部 -->
  <rect x="40" y="715" width="600" height="95" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="737" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">数据分析（9 类：产品/线索/市场ROI/客户/商机/报价/合同/订单回款/财务营收）</text>
  <text x="200" y="760" font-family="sans-serif" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">＋ 个人效率视图（我的待办/我的客户健康/我的获客漏斗）</text>

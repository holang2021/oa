<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOLANG 企微登录 - 授权回调</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f3f4f6; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; color: #111827;
    }
    .callback-card {
      background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 40px; text-align: center; max-width: 420px; width: 90%;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #e5e7eb;
      border-top-color: #1a56db; border-radius: 50%; margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.2rem; margin-bottom: 10px; color: #1a56db; }
    .status { font-size: 0.9rem; color: #6b7280; margin-bottom: 20px; }
    .error { color: #dc2626; font-size: 0.85rem; margin-top: 12px; padding: 10px; background: #fee2e2; border-radius: 6px; display: none; }
    .error.show { display: block; }
    .detail { font-size: 0.8rem; color: #9ca3af; margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="callback-card">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">正在完成企业微信登录</h2>
    <p class="status" id="status">验证授权信息...</p>
    <div class="error" id="error"></div>
    <p class="detail" id="detail"></p>
  </div>

  <script>
  /**
   * HOLANG 企微 OAuth 回调处理页
   *
   * 流程：
   * 1. 企微授权后跳转至此页，URL 携带 ?code=xxx&state=xxx
   * 2. 校验 state 防 CSRF
   * 3. 通过后端代理 API 用 code 换取用户身份
   * 4. 将认证信息写入 localStorage/sessionStorage
   * 5. 跳回主应用
   *
   * 代理 API 模式：
   *   POST {WECOM_CONFIG.proxyApi}
   *   Body: { code: "xxx" }
   *   Response: { userId: "xxx", name: "xxx", avatar: "xxx" }
   *
   * 演示模式（proxyApi 未配置时）：
   *   使用 URL 参数模拟用户信息，仅用于开发调试
   */

  // ==================== 企微配置（与 app.js 保持一致） ====================
  const WECOM_CONFIG = {
    corpId: 'wwe74343b7a90d201f',
    proxyApi: '', // 后端代理地址，留空则使用演示模式
  };

  // ==================== UI 辅助 ====================
  function setStatus(text, isError) {
    document.getElementById('status').textContent = text;
    if (isError) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = '登录失败';
      document.getElementById('title').style.color = '#dc2626';
    }
  }

  function showError(msg, detail) {
    const errEl = document.getElementById('error');
    errEl.textContent = msg;
    errEl.classList.add('show');
    if (detail) document.getElementById('detail').textContent = detail;
    setStatus(msg, true);
  }

  // ==================== 主流程 ====================
  async function handleCallback() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');

    // 1. 校验参数
    if (!code) {
      showError('缺少授权码 (code)', '请从企业微信客户端重新发起登录');
      return;
    }

    // 2. 校验 state（防 CSRF）
    const savedState = sessionStorage.getItem('wecom_oauth_state');
    if (savedState && state !== savedState) {
      showError('安全校验失败 (state mismatch)', '请重新发起登录');
      return;
    }

    setStatus('正在获取用户信息...');

    // 3. 通过代理 API 换取用户信息
    let userInfo = null;

    if (WECOM_CONFIG.proxyApi) {
      // === 正式模式：调用后端代理 ===
      userInfo = await exchangeViaProxy(code);
    } else {
      // === 演示模式：模拟企微返回 ===
      userInfo = await demoExchange(code);
    }

    if (!userInfo) return; // 错误已显示

    // 4. 认证成功，写入存储
    const authData = {
      provider: 'wecom',
      userId: userInfo.userId,
      name: userInfo.name,
      avatar: userInfo.avatar || '',
      role: userInfo.role || '员工',
      timestamp: Date.now(),
    };

    localStorage.setItem('holang_admin_auth', JSON.stringify(authData));
    sessionStorage.removeItem('wecom_oauth_state');

    setStatus('登录成功，正在跳转...');

    // 5. 跳回主应用
    const returnUrl = sessionStorage.getItem('wecom_oauth_return');
    if (returnUrl) {
      // 通过 URL 参数传递 token（主应用 checkWecomCallbackReturn 会处理）
      const token = btoa(JSON.stringify(authData));
      window.location.href = returnUrl + (returnUrl.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
    } else {
      window.location.href = window.location.origin + window.location.pathname.replace(/oauth-callback\.html.*$/, '') + '#/dashboard';
    }

    sessionStorage.removeItem('wecom_oauth_return');
  }

  // ==================== 后端代理模式 ====================
  async function exchangeViaProxy(code) {
    try {
      const resp = await fetch(WECOM_CONFIG.proxyApi, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });

      if (!resp.ok) {
        const errText = await resp.text().catch(() => '');
        showError('代理认证失败 (HTTP ' + resp.status + ')', errText || '请检查后端代理服务');
        return null;
      }

      const data = await resp.json();
      if (!data.userId || !data.name) {
        showError('代理返回数据不完整', JSON.stringify(data));
        return null;
      }

      document.getElementById('detail').textContent = '用户: ' + data.name + ' (' + data.userId + ')';
      return data;
    } catch (e) {
      showError('无法连接到认证代理', e.message);
      return null;
    }
  }

  // ==================== 演示模式（无后端时） ====================
  async function demoExchange(code) {
    // 演示模式：将 code 前缀作为用户标识，生成模拟用户信息
    // 实际环境中这段代码不会执行（会走 proxyApi 分支）
    const hash = code.slice(0, 6).toUpperCase();
    const demoUser = {
      userId: 'demo_' + hash,
      name: '企微用户(' + hash + ')',
      avatar: '',
      role: '员工',
    };

    document.getElementById('detail').textContent = '演示模式 - 用户: ' + demoUser.name;
    document.getElementById('title').textContent = '登录成功（演示模式）';

    // 模拟网络延迟
    await new Promise(r => setTimeout(r, 600));

    return demoUser;
  }

  // ==================== 启动 ====================
  handleCallback();
  </script>
</body>
</html>
